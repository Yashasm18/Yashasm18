name: Update streak stats

on:
  schedule:
    # Run every 30 minutes — keeps streak stats fresh throughout the day
    - cron: "*/30 * * * *"
  push:
    paths-ignore:
      # The workflow commits this generated file itself; do not start another run for it.
      - "profile/streak.svg"
  workflow_dispatch: # Run manually from the Actions tab
  repository_dispatch: # Allow external triggers

# Prevent duplicate runs from racing each other and creating push conflicts
concurrency:
  group: streak-stats
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          # Always work on the absolute latest commit to avoid push conflicts
          ref: main
          # Full history required so git pull --rebase always succeeds
          fetch-depth: 0

      - name: Generate streak stats (Primary: Action)
        id: primary_streak
        continue-on-error: true
        uses: DenverCoder1/github-readme-streak-stats@v1.7.0
        with:
          options: user=${{ github.repository_owner }}&background=010102&stroke=010102&ring=a78bfa&fire=7dd3fc&currStreakNum=e9e9f5&sideNums=e9e9f5&currStreakLabel=b9bcd9&sideLabels=b9bcd9&dates=8890c0&hide_border=true&timezone=Asia/Kolkata&v=8
          path: profile/streak.svg
          token: ${{ secrets.STREAK_STATS_TOKEN }}

      - name: Offset Total Contributions (if Primary succeeded)
        if: steps.primary_streak.outcome == 'success'
        run: |
          # The user has 40 commits that occurred prior to their account creation date (Sep 25, 2025).
          # github-readme-streak-stats only queries from the account creation date, missing these 40 commits.
          # We extract the Total Contributions number from the SVG, add 40, and replace it.

          python3 -c "
          import re
          import sys

          with open('profile/streak.svg', 'r') as f:
              svg = f.read()

          # Find the big number for total contributions
          pattern = r'(<!-- Total Contributions big number -->.*?<text[^>]*>\s*)([0-9,]+)(\s*</text>)'

          def replacer(match):
              prefix = match.group(1)
              number_str = match.group(2).replace(',', '')
              suffix = match.group(3)
              new_number = int(number_str) + 40
              return f'{prefix}{new_number:,}{suffix}'

          new_svg, count = re.subn(pattern, replacer, svg, flags=re.DOTALL)

          if count == 0:
              print('ERROR: Could not find Total Contributions number in SVG')
              sys.exit(1)

          with open('profile/streak.svg', 'w') as f:
              f.write(new_svg)

          print('Successfully offset Total Contributions (+40)')
          "

      - name: Fallback Streak Generator (if GitHub GraphQL API failed)
        if: steps.primary_streak.outcome != 'success'
        run: |
          # Fallback: Scrape public contributions endpoint directly if GraphQL returns 503 or fails
          python3 -c "
          import urllib.request, re, datetime, sys

          def update_streak(username, offset=40):
              url = f'https://github.com/users/{username}/contributions'
              req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0'})
              try:
                  html = urllib.request.urlopen(req, timeout=15).read().decode('utf-8')
              except Exception as e:
                  print(f'Failed to fetch public profile: {e}')
                  return False

              matches = re.findall(r'<td[^>]*data-date=\"(\d{4}-\d{2}-\d{2})\"[^>]*>[\s\S]*?<tool-tip[^>]*>([\s\S]*?)</tool-tip>', html)
              if not matches:
                  print('No contribution days found in HTML')
                  return False

              contributions = {}
              total = 0
              for date, tip in matches:
                  m = re.search(r'(\d+)\s+contribution', tip)
                  c = int(m.group(1)) if m else 0
                  contributions[date] = c
                  total += c

              sorted_dates = sorted(contributions.keys())
              all_days = [(d, contributions[d]) for d in reversed(sorted_dates)]
              idx = 0
              while idx < len(all_days) and all_days[idx][1] == 0:
                  idx += 1

              current_streak = 0
              streak_end = None
              streak_start = None
              if idx < len(all_days):
                  streak_end = all_days[idx][0]
                  while idx < len(all_days) and all_days[idx][1] > 0:
                      streak_start = all_days[idx][0]
                      current_streak += 1
                      idx += 1

              longest_streak = 0
              cur = 0
              l_start = None
              l_end = None
              temp_start = None
              for d in sorted_dates:
                  if contributions[d] > 0:
                      if cur == 0:
                          temp_start = d
                      cur += 1
                      if cur > longest_streak:
                          longest_streak = cur
                          l_start = temp_start
                          l_end = d
                  else:
                      cur = 0

              def fmt_date(d_str):
                  if not d_str: return ''
                  dt = datetime.datetime.strptime(d_str, '%Y-%m-%d')
                  return dt.strftime('%b %-d')

              curr_range = f'{fmt_date(streak_start)} - {fmt_date(streak_end)}'
              longest_range = f'{fmt_date(l_start)} - {fmt_date(l_end)}'
              total_with_offset = total + offset

              print(f'Fallback computed: Total={total_with_offset}, Current={current_streak} ({curr_range}), Longest={longest_streak} ({longest_range})')
              
              with open('profile/streak.svg', 'r') as f:
                  svg = f.read()

              svg = re.sub(r'(<!-- Total Contributions big number -->.*?<text[^>]*>\s*)([0-9,]+)(\s*</text>)', f'\\g<1>{total_with_offset:,}\\g<3>', svg, flags=re.DOTALL)
              svg = re.sub(r'(<!-- Current Streak range -->.*?<text[^>]*>\s*)([^\n<]+)(\s*</text>)', f'\\g<1>{curr_range}\\g<3>', svg, flags=re.DOTALL)
              svg = re.sub(r'(<!-- Current Streak big number -->.*?<text[^>]*>\s*)([0-9,]+)(\s*</text>)', f'\\g<1>{current_streak}\\g<3>', svg, flags=re.DOTALL)
              svg = re.sub(r'(<!-- Longest Streak big number -->.*?<text[^>]*>\s*)([0-9,]+)(\s*</text>)', f'\\g<1>{longest_streak}\\g<3>', svg, flags=re.DOTALL)
              svg = re.sub(r'(<!-- Longest Streak range -->.*?<text[^>]*>\s*)([^\n<]+)(\s*</text>)', f'\\g<1>{longest_range}\\g<3>', svg, flags=re.DOTALL)

              with open('profile/streak.svg', 'w') as f:
                  f.write(svg)
              print('profile/streak.svg successfully updated via fallback!')
              return True

          update_streak('${{ github.repository_owner }}', 40)
          "

      - name: Commit and push streak stats
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/streak.svg

          # Only commit if the SVG actually changed (avoids empty commit noise)
          if git diff --cached --quiet; then
            echo "No changes to streak stats — skipping commit"
            exit 0
          fi

          # Update cache-buster query parameter in README.md to purge GitHub Camo CDN cache
          sed -i 's|profile/streak.svg?v=[^"]*|profile/streak.svg?v='$(date +%s)'|g' README.md
          git add README.md

          git commit -m "Update streak stats"

          # Pull latest changes before pushing to avoid rejection
          # Use rebase to keep a clean linear history
          git pull --rebase origin main

          git push origin main
