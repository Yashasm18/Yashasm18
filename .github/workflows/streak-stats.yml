name: Update streak stats

on:
  schedule:
    # Run every 30 minutes — keeps streak stats fresh throughout the day
    - cron: "*/30 * * * *"
  push:
    branches:
      - main
    paths-ignore:
      # Generated files and cache-busters should not trigger another run
      - "profile/**"
      - "README.md"
  workflow_dispatch: # Run manually from the Actions tab
  repository_dispatch: # Allow external triggers

# Prevent duplicate runs from racing each other and creating push conflicts
concurrency:
  group: streak-stats
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          # Always work on the absolute latest commit to avoid push conflicts
          ref: main
          # Full history required so git pull --rebase always succeeds
          fetch-depth: 0

      - name: Generate streak stats
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 .github/scripts/update_streak.py --username "${{ github.repository_owner }}" --path profile/streak.svg --offset 40

      - name: Commit and push streak stats
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/streak.svg

          # Only commit if the SVG actually changed (avoids empty commit noise)
          if git diff --cached --quiet; then
            echo "No changes to streak stats — skipping commit"
            exit 0
          fi

          # Update cache-buster query parameter in README.md to purge GitHub Camo CDN cache
          sed -i 's|profile/streak.svg?v=[^"]*|profile/streak.svg?v='$(date +%s)'|g' README.md
          git add README.md

          git commit -m "Update streak stats"

          # Pull latest changes before pushing to avoid rejection
          # Use rebase to keep a clean linear history
          git pull --rebase origin main

          git push origin main
