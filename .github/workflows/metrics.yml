name: Generate metrics

on:
  schedule:
    - cron: "30 18 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - "profile/metrics*.svg"

concurrency:
  group: metrics
  cancel-in-progress: true

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      # ── Activity overview (Commits / PRs / Issues / Code review breakdown) ──
      - name: Activity overview
        uses: lowlighter/metrics@v3.34
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # Let the action commit directly to the repo
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          committer_branch: main
          filename: profile/metrics-activity.svg
          user: Yashasm18
          base: activity
          plugin_followup: yes
          plugin_followup_sections: repositories
          config_timezone: Asia/Kolkata
          config_display: large
          config_animations: yes
          # Use commit output action so files are committed automatically
          output_action: commit

      # ── 3D isometric contribution calendar ──
      - name: Isometric calendar
        uses: lowlighter/metrics@v3.34
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          committer_branch: main
          filename: profile/metrics-isocalendar.svg
          user: Yashasm18
          base: ""
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          config_timezone: Asia/Kolkata
          config_display: large
          config_animations: yes
          output_action: commit
