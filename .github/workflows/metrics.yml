name: Generate metrics

on:
  schedule:
    # Runs every day at midnight IST (18:30 UTC)
    - cron: "30 18 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - "profile/metrics*.svg"

concurrency:
  group: metrics
  cancel-in-progress: true

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      # ── 1. Activity overview radar chart (Commits / PRs / Issues / Code review) ──
      - name: Activity overview
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: profile/metrics-activity.svg
          base: activity
          plugin_followup: yes
          plugin_followup_sections: repositories
          plugin_habits: yes
          plugin_habits_from: 200
          plugin_habits_days: 14
          plugin_habits_facts: no
          plugin_habits_charts: yes
          plugin_habits_charts_type: graph
          config_timezone: Asia/Kolkata
          config_display: large
          config_animations: yes
          config_padding: 8, 14
          # Dark theme matching your profile colors
          config_base64: no
          extras_css: |
            :root {
              --color-bg: #010102;
              --color-bg-secondary: #0d0d1a;
              --color-border: #1e1e3a;
              --color-text: #e9e9f5;
              --color-text-secondary: #b9bcd9;
              --color-accent: #a78bfa;
              --color-accent-2: #7dd3fc;
            }
            .header { background: #010102 !important; }
            .markdown { background: #010102 !important; }
          output_action: none

      # ── 2. Contribution calendar (isometric 3D heatmap) ──
      - name: Isometric calendar
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: profile/metrics-isocalendar.svg
          base: ""
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          config_timezone: Asia/Kolkata
          config_display: large
          config_animations: yes
          output_action: none

      # ── 3. Commit and push all generated SVGs ──
      - name: Commit and push metrics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/metrics-activity.svg profile/metrics-isocalendar.svg

          if git diff --cached --quiet; then
            echo "No changes to metrics — skipping commit"
            exit 0
          fi

          git commit -m "Update metrics [skip ci]"
          git pull --rebase origin main
          git push origin main
